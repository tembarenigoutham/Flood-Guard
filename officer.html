<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Command Officer - FloodGuard</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand"><i class="fa-solid fa-shield-halved"></i> Command Center Control</div>
    <div class="nav-links">
      <span style="color:var(--text-muted)">Role: <span style="color:white;font-weight:bold;">Chief Officer</span></span>
      <a href="index.html" style="background: rgba(255,255,255,0.1);">Logout</a>
    </div>
  </nav>

  <main class="container">
    <div class="dashboard-grid" style="grid-template-columns: 2fr 1fr;">
      
      <!-- God Map -->
      <div class="glass-card" style="display:flex; flex-direction:column; padding: 0.5rem; border: 2px solid rgba(59, 130, 246, 0.3);">
        <h3 class="card-title" style="padding: 1rem 1rem 0 1rem; margin:0;"><i class="fa-solid fa-satellite"></i> Live Satellite Tracking</h3>
        <div id="godMap" style="flex:1; min-height: 500px; border-radius: 8px; margin-top: 1rem; z-index: 1;"></div>
      </div>

      <!-- Controls -->
      <div style="display: flex; flex-direction: column; gap: 1.5rem;">
        
        <!-- Global Alert Control -->
        <div class="glass-card">
          <h3 class="card-title">Global Broadcast Protocol</h3>
          <p style="color:var(--text-muted); font-size:0.9rem; margin-bottom: 1rem;">Changes instantly push out to all civilian screens and map zones in the network.</p>
          <select id="globalAlertSelect" class="form-control" style="margin-bottom: 1rem; font-size: 1.1rem; font-weight: bold; padding: 1rem;" onchange="db.setGlobalAlert(this.value)">
             <option value="Normal">Status: NORMAL (No floods)</option>
             <option value="Moderate">Status: MODERATE (Warning)</option>
             <option value="Critical">Status: CRITICAL (Danger Alert)</option>
          </select>
        </div>

        <!-- Activity Feed -->
        <div class="glass-card" style="flex: 1; overflow-y: auto; max-height: 350px;">
          <h3 class="card-title">Live Dispatch Log</h3>
          <ul class="list-group" id="activityFeed">
            <!-- Feed injected here -->
          </ul>
        </div>
        
      </div>
    </div>
  </main>

  <script src="js/app.js"></script>
  <script>
    // Initialize Map on India
    const map = L.map('godMap').setView([26.0, 92.5], 7); 
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
    let markersArray = [];

    // Custom Icons
    const sosIcon = L.divIcon({className: 'sos-marker', html: '<i class="fa-solid fa-person-drowning" style="color:#ef4444; font-size:24px; filter: drop-shadow(0 0 5px red);"></i>', iconSize: [24, 24]});
    const assignedIcon = L.divIcon({className: 'worker-marker', html: '<i class="fa-solid fa-helicopter" style="color:#f59e0b; font-size:24px;"></i>', iconSize: [24, 24]});
    const savedIcon = L.divIcon({className: 'safe-marker', html: '<i class="fa-solid fa-check-circle" style="color:#10b981; font-size:24px;"></i>', iconSize: [24, 24]});

    window.onDbUpdate = function(state) {
      // Sync dropdown with current reality
      document.getElementById('globalAlertSelect').value = state.globalAlert;

      // Clear old map markers
      markersArray.forEach(m => map.removeLayer(m));
      markersArray = [];

      const feed = document.getElementById('activityFeed');
      feed.innerHTML = '';
      
      if(state.sosRequests.length === 0) {
        feed.innerHTML = '<p style="color:var(--text-muted); font-size:0.9rem;">No activities logged on network.</p>';
        return;
      }

      state.sosRequests.forEach(req => {
         // Plot on Map
         let iconToUse = sosIcon;
         let statusText = 'CRITICAL SOS SIGNAL';
         let logColor = 'var(--risk-high)';
         
         if(req.status === 'assigned') { iconToUse = assignedIcon; statusText = `En route: Unit ${req.workerName}`; logColor = 'var(--risk-medium)'; }
         if(req.status === 'rescued') { iconToUse = savedIcon; statusText = `SAFE (Rescued)`; logColor = 'var(--risk-low)'; }
         
         const m = L.marker([req.lat, req.lng], {icon: iconToUse}).addTo(map)
                    .bindPopup(`<b>${req.userName}</b><br>${statusText}`);
         markersArray.push(m);

         // Log in activity feed
         feed.innerHTML += `
            <li class="list-item" style="border-left: 3px solid ${logColor}; padding-left: 10px;">
               <div style="font-size:0.85rem; color:var(--text-muted);">Ref: #${req.id.substr(-6)}</div>
               <div style="font-weight:bold; color:#fff;">Citizen: ${req.userName}</div>
               <div style="font-size:0.9rem; color:${logColor};">${statusText}</div>
            </li>
         `;
      });
    };

    window.onDbUpdate(db.get());
  </script>
</body>
</html>
